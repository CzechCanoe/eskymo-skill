name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: LibreOffice (kontrolní přepočet)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libreoffice-calc
      - name: Závislosti
        run: python -m pip install -r skills/csk-eskymo/scripts/requirements.txt
      - name: Testy
        run: python tests/run_tests.py
      - name: Balíček skillu
        run: python tools/build_skill_zip.py
      - uses: actions/upload-artifact@v4
        with:
          name: csk-eskymo
          path: dist/csk-eskymo.zip
